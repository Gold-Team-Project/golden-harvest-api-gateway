server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: local

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**

            - id: customer-support-service
              uri: http://customer-support-service:8088
              predicates:
                - Path=/api/inquiries/**,/api/admin/inquiries/**

            - id: master-data-service
              uri: http://master-data-service:8085
              predicates:
                - Path=/api/master-data/**

            - id: inventory-service
              uri: http://inventory-service:8084
              predicates:
                - Path=/api/discard/**,/api/items/**,/api/inbound,/api/outbound,/api/admin/items,/api/price-policy


            - id: sales-service
              uri: http://sales-service:8083
              predicates:
                - Path=/api/sales/**,/api/cart/**

            - id: user-service
              uri: http://user-service:8082
              predicates:
                - Path=/api/admin/user/**,/api/user/**

            - id: notification-service
              uri: http://notification-service:8087
              predicates:
                - Path=/api/notifications/**

            - id: purchases-service
              uri: http://purchases-service:8086
              predicates:
                - Path=/api/purchase/**

            - id: ai-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=2

jwt:
  secret-key: ${JWT_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    # Gateway의 라우팅 매칭 과정을 상세히 출력
    org.springframework.cloud.gateway: TRACE
    # HTTP 요청/응답 헤더 및 바디 관련 디버깅 (선택 사항)
    org.springframework.http.server.reactive: DEBUG
    # 프로젝트 자체 필터나 로직 확인용
    com.teamgold.apigateway: DEBUG
