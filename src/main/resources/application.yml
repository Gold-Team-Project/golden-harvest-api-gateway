server:
  port: 8000

spring:
  application:
    name: api-gateway
  profiles:
    active: local

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**

            - id: customer-support-service
              uri: http://customer-support-service:8088
              predicates:
                - Path=/api/inquiries/**, /api/admin/inquiries/**

            - id: master-data-service
              uri: http://master-data-service:8085
              predicates:
                - Path=/api/master-data/**

            - id: inventory-service
              uri: http://inventory-service:8084
              predicates:
                - Path=/api/discard/**,/api/items,/api/inbound,/api/outbound,/api/admin/items,/api/price-policy


            - id: sales-service
              uri: http://sales-service:8083
              predicates:
                - Path=/api/sales/**,/api/cart/**

            - id: user-service
              uri: http://user-service:8082
              predicates:
                - Path=/api/admin/user/**,/api/user/**

            - id: notification-service
              uri: http://notification-service:8087
              predicates:
                - Path=/api/notifications/**,

            - id: purchases-service
              uri: http://purchases-service:8086
              predicates:
                - Path=/api/purchase/**

            - id: ai-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  secret-key: ${JWT_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
